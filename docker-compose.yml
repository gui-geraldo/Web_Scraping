services:
  vigia:
    build: .
    container_name: vigia
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - DATA_DIR=/data
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
    volumes:
      - ./data:/data
    # Indeed/InfoJobs sobem vários processos do Chromium; damos memória de sobra.
    shm_size: "1gb"
